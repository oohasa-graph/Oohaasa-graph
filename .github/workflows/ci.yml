name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATA_FIXTURE_MODE: "1"
      PRIVATE_USERNAME: "owner"
      PRIVATE_PASSWORD_HASH: >-
        $2b$04$pEQRgB0EyvbiupFbd0AAPeL2wPrDEWOKay1x3m5nIVIhqiKncMHlm
      NEXTAUTH_SECRET: "test-secret-with-at-least-thirty-two-characters"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      INGEST_SECRET: "test-ingest-secret-with-at-least-thirty-two-characters"
      DATABASE_URL: "postgres://unused:unused@127.0.0.1:5432/unused"
      SOURCE_USER_AGENT: "oohaasa-gogo-ci/0.1 (contact: test@example.invalid)"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Sparse-data browser regressions
        run: npm run test:e2e -- --grep 'sparse board|selected empty'
        env:
          DATA_FIXTURE_MODE: "sparse"
