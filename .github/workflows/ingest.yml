name: Ingest daily fortune rankings

on:
  schedule:
    - cron: "15 20 * * *"
    - cron: "15 21 * * *"
    - cron: "45 22 * * *"
    - cron: "50 23 * * *"
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [all, ohaasa, gogo]
        default: all
      force:
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      INGEST_URL: ${{ secrets.INGEST_URL }}
      INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
      SCHEDULE: ${{ github.event.schedule }}
      SOURCE_INPUT: ${{ github.event.inputs.source || 'all' }}
      FORCE_INPUT: ${{ github.event.inputs.force || 'false' }}
    steps:
      - name: Validate ingestion configuration
        shell: bash
        run: |
          missing=false
          if [[ -z "${INGEST_URL:-}" ]]; then
            echo "::error::Required Actions secret INGEST_URL is not configured"
            missing=true
          fi
          if [[ -z "${INGEST_SECRET:-}" ]]; then
            echo "::error::INGEST_SECRET is not configured"
            missing=true
          fi
          if [[ "$missing" == "true" ]]; then
            exit 1
          fi

      - name: Derive ingestion attempt
        id: attempt
        shell: bash
        run: |
          case "$SCHEDULE" in
            "15 20 * * *") attempt="primary" ;;
            "15 21 * * *") attempt="retry_1" ;;
            "45 22 * * *") attempt="retry_2" ;;
            "50 23 * * *") attempt="final" ;;
            *) attempt="manual" ;;
          esac
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"

      - name: Fetch sources and call protected ingestion endpoint
        env:
          ATTEMPT: ${{ steps.attempt.outputs.attempt }}
        shell: bash
        run: |
          source_input="$SOURCE_INPUT"
          force_input="$FORCE_INPUT"
          failed=0
          for source in ohaasa gogo; do
            if [[ "$source_input" != "all" ]] && [[ "$source_input" != "$source" ]]; then
              continue
            fi
            if [[ "$source" == "ohaasa" ]]; then
              url="https://www.asahi.co.jp/data/ohaasa2020/horoscope.json"
            else
              url="https://www.tv-asahi.co.jp/goodmorning/uranai/"
            fi
            body=$(jq -n --arg attempt "$ATTEMPT" \
              --arg source "$source" --argjson force "$force_input" \
              '{attempt: $attempt, source: $source, force: $force}')
            file=$(mktemp)
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --user-agent 'Oohaasa-graph/1.0 (github.com/oohasa-graph)' \
              --output "$file" "$url"; then
              if [[ "$source" == "gogo" ]]; then
                body=$(jq -n --argjson request "$body" \
                  --rawfile content "$file" \
                  '$request + {sourceBody: $content}')
              else
                body=$(jq -n --argjson request "$body" \
                  --slurpfile content "$file" \
                  '$request + {sourceBody: $content[0]}')
              fi
            fi
            rm -f "$file"
            if ! curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 120 \
              -X POST "$INGEST_URL" \
              -H "Authorization: Bearer $INGEST_SECRET" \
              -H "Content-Type: application/json" \
              --data "$body"; then
              failed=1
            fi
            echo
          done
          exit "$failed"
